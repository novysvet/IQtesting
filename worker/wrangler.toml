name = "iqtesting-collect"
main = "index.js"
compatibility_date = "2024-12-01"

# Deploy:
#   npx wrangler kv namespace create SESSIONS
#   npx wrangler kv namespace create RATE
# then paste the returned ids below and `npx wrangler deploy`.
# ALLOWED_ORIGIN must be the exact Pages origin for CORS.
[vars]
ALLOWED_ORIGIN = "https://novysvet.github.io"

[[kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_WITH_SESSIONS_NAMESPACE_ID"

[[kv_namespaces]]
binding = "RATE"
id = "REPLACE_WITH_RATE_NAMESPACE_ID"

[[routes]]
pattern = "iqtesting-collect.<your-subdomain>.workers.dev/*"
